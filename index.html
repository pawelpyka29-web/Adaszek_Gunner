<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Strike</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
        <div class="panel">
            <div class="logo">NEON<span>STRIKE</span></div>
            <p class="subtitle">MULTIPLAYER ARENA</p>

            <input id="nickname" maxlength="16" placeholder="Twój nick" value="Player">
            <input id="room" maxlength="20" placeholder="Nazwa pokoju" value="arena1">

            <button id="play">GRAJ</button>

            <p class="hint">
                WASD – ruch | SHIFT – sprint | SPACE – skok<br>
                LPM – strzał | ESC – wyjście z myszki
            </p>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div class="topbar">
            <div class="brand">NEON<span>STRIKE</span></div>
            <div id="roomInfo">ARENA</div>
        </div>

        <div class="stats">
            <div class="stat">
                <span>KILLS</span>
                <strong id="kills">0</strong>
            </div>
            <div class="stat">
                <span>DEATHS</span>
                <strong id="deaths">0</strong>
            </div>
            <div class="stat">
                <span>HP</span>
                <strong id="health">100</strong>
            </div>
        </div>

        <div id="leaderboard">
            <h3>TOP GRACZE</h3>
            <div id="leaderboardList"></div>
        </div>

        <div id="killfeed"></div>

        <div id="crosshair">
            <span></span><span></span><span></span><span></span>
        </div>

        <div id="hitmarker">✕</div>

        <div id="respawn" class="hidden">
            <h1>ZGINĄŁEŚ</h1>
            <p>Odradzanie...</p>
        </div>

        <div id="lockMessage">
            Kliknij ekran, aby odzyskać sterowanie
        </div>
    </div>

    <div id="loading" class="hidden">ŁADOWANIE ARENY...</div>

    <script type="module" src="game.js"></script>
</body>
</html>
