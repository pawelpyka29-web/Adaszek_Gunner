<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kryształowy Labirynt 3D - Multiplayer</title>
<!-- Dołączamy PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  *{box-sizing:border-box} body{margin:0;overflow:hidden;background:#101827;color:white;font-family:Arial,sans-serif}
  canvas{display:block} #hud{position:fixed;top:16px;left:16px;z-index:2;background:#101827cc;padding:12px 16px;border:1px solid #ffffff30;border-radius:12px;line-height:1.6}
  #help{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:2;background:#101827cc;padding:10px 16px;border-radius:10px;text-align:center;font-size:14px;white-space:nowrap}
  #overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#08111ddd;text-align:center;padding:20px}
  #panel{max-width:520px;background:#172438;padding:30px;border:1px solid #ffffff30;border-radius:18px;box-shadow:0 20px 80px #0008}
  h1{margin:0 0 12px;font-size:32px} p{line-height:1.5;color:#d5deeb}
  button{border:0;border-radius:10px;padding:13px 24px;background:#36c5a1;color:#06251e;font-weight:bold;font-size:16px;cursor:pointer}
  input {padding: 10px; border-radius: 8px; border: 1px solid #555; width: 65%; background: #08111d; color: white; font-size: 14px;}
  #message{font-weight:bold;color:#7cf2d0;margin-top:10px;}
</style>
</head>
<body>
<div id="hud">💎 Kryształy: <span id="score">0</span>/8<br>❤️ Życia: <span id="lives">3</span><br>🌐 Status: <span id="net-status" style="color:#ffeb3b">Oczekiwanie</span></div>
<div id="help">WASD – ruch · Mysz – rozglądanie · Spacja – skok · Shift – sprint · ESC – pauza</div>

<div id="overlay"><div id="panel">
  <h1>Kryształowy Labirynt 3D</h1>
  <p>Zbierz wszystkie 8 kryształów i unikaj strażników.</p>
  
  <!-- Sekcja Multiplayer w Menu -->
  <div style="background: #101827; padding: 12px; border-radius: 10px; margin: 15px 0; border: 1px solid #ffffff20;">
    <p style="margin: 0 0 8px; font-size: 13px;">Twój ID: <b id="my-peer-id" style="color:#7cf2d0">Łączenie...</b></p>
    <input type="text" id="friend-peer-id" placeholder="Wpisz ID znajomego">
    <button id="connect-btn" style="padding: 10px 16px; font-size: 14px; background: #45f4ee; margin-left: 5px;">Połącz</button>
    <p id="connection-msg" style="margin: 8px 0 0; font-size: 12px; color: #ffeb3b;"></p>
  </div>

  <button id="start">GRAJ</button>
  <p id="message"></p>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  // --- INICJALIZACJA PEERJS ---
  let peer = new Peer();
  let conn = null;
  let isConnected = false;

  peer.on('open', (id) => {
    const el = document.getElementById('my-peer-id');
    if(el) el.textContent = id;
  });

  peer.on('connection', (incomingConn) => {
    conn = incomingConn;
    setupConnection();
  });

  document.getElementById('connect-btn').onclick = () => {
    const friendId = document.getElementById('friend-peer-id').value.trim();
    if (!friendId) { alert('Wpisz najpierw ID znajomego!'); return; }
    document.getElementById('connection-msg').textContent = 'Łączenie z graczem...';
    conn = peer.connect(friendId);
    setupConnection();
  };

  function setupConnection() {
    if(!conn) return;
    conn.on('open', () => {
      isConnected = true;
      document.getElementById('connection-msg').textContent = 'Połączono pomyślnie!';
      document.getElementById('connection-msg').style.color = '#36c5a1';
      document.getElementById('net-status').textContent = 'Połączono (Online)';
      document.getElementById('net-status').style.color = '#36c5a1';
    });

    conn.on('data', (data) => {
      if(data && data.x !== undefined && data.z !== undefined && typeof friendMesh !== 'undefined') {
        friendMesh.position.set(data.x, 0, data.z);
      }
    });
  }

  // --- GRA THREE.JS ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x91b8d5);
  scene.fog = new THREE.Fog(0x91b8d5, 22, 75);
  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, .1, 120);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xd9efff,0x46506a,2));
  const sun = new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(-12,24,8); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); scene.add(sun);

  const mat = (color, roughness=.85) => new THREE.MeshStandardMaterial({color,roughness});
  const floorMat=mat(0x4d8062), wallMat=mat(0x68778a), trimMat=mat(0x34465b);
  const solids=[];
  function block(x,y,z,w,h,d,material,collide=true){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
    m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; scene.add(m);
    if(collide) solids.push({x,z,w,d,top:y+h/2});
    return m;
  }
  block(0,-.55,0,48,1,48,floorMat,false);
  block(0,1,-24,48,3,1,wallMat); block(0,1,24,48,3,1,wallMat);
  block(-24,1,0,1,3,48,wallMat); block(24,1,0,1,3,48,wallMat);
  [
    [-12,0,1,28],[-3,-10,18,1],[7,-2,1,25],[15,10,18,1],
    [-14,15,15,1],[-18,-12,1,14],[-8,7,1,13],[0,18,1,10],
    [13,-16,16,1],[19,-5,1,13],[-2,1,10,1],[8,8,1,10]
  ].forEach(([x,z,w,d])=>block(x,1.15,z,w,2.3,d,wallMat));

  for(let i=0;i<18;i++){
    const x=((i*17)%39)-19, z=((i*23)%39)-19;
    if(Math.abs(x)<5 && Math.abs(z)<5) continue;
    const p=new THREE.Mesh(new THREE.CylinderGeometry(.25,.38,1.8,8),trimMat);
    p.position.set(x,.9,z); p.castShadow=true; scene.add(p);
  }

  // Model drugiego gracza
  const friendMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.8), mat(0xff9800));
  friendMesh.position.set(0, 0.8, 0);
  scene.add(friendMesh);

  const crystals=[];
  const crystalMat=new THREE.MeshStandardMaterial({color:0x45f4ee,emissive:0x087d89,emissiveIntensity:1.5,metalness:.25,roughness:.2});
  const crystalSpots=[[-19,-19],[-5,-19],[5,-18],[19,-18],[-19,8],[-5,19],[10,15],[19,19]];
  crystalSpots.forEach(([x,z])=>{
    const g=new THREE.Group();
    const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.65),crystalMat);
    gem.position.y=1.15; gem.castShadow=true; g.add(gem);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.85,.035,8,32),mat(0x65fff4,.3));
    ring.rotation.x=Math.PI/2; ring.position.y=.25; g.add(ring);
    g.position.set(x,0,z); scene.add(g); crystals.push(g);
  });

  const enemies=[];
  for(let i=0;i<4;i++){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.4,1),new THREE.MeshStandardMaterial({color:0xc33b4b,emissive:0x3d0710}));
    body.position.y=.8; body.castShadow=true; g.add(body);
    const eyeMat=new THREE.MeshBasicMaterial({color:0xffffaa});
    for(const ex of [-.23,.23]){const e=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),eyeMat);e.position.set(ex,1,.51);g.add(e);}
    g.position.set([-17,17,-1,17][i],0,[-4,15,20,-20][i]); scene.add(g);
    enemies.push({mesh:g,origin:g.position.clone(),phase:i*1.7});
  }

  const player={x:-20,z:-20,y:0,vy:0,yaw:Math.PI/4,pitch:0,onGround:true};
  camera.position.set(player.x,1.65,player.z);
  const keys={}; let locked=false, score=0,lives=3,ended=false,last=performance.now(),invuln=0;
  const overlay=document.getElementById('overlay'), startBtn=document.getElementById('start');
  const scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives');

  function show(title,desc,button,message=''){
    document.querySelector('h1').textContent=title;
    document.querySelector('p').textContent=desc;
    startBtn.textContent=button; document.getElementById('message').textContent=message;
    overlay.style.display='flex';
  }
  startBtn.onclick=()=>{ if(ended) location.reload(); else renderer.domElement.requestPointerLock(); };
  document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;if(locked)overlay.style.display='none';});
  document.addEventListener('mousemove',e=>{if(!locked)return;player.yaw-=e.movementX*.0022;player.pitch-=e.movementY*.0018;player.pitch=Math.max(-1.15,Math.min(1.15,player.pitch));});
  addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});
  addEventListener('keyup',e=>keys[e.code]=false);

  function collides(x,z){
    const r=.38;
    return solids.some(s=>x+r>s.x-s.w/2&&x-r<s.x+s.w/2&&z+r>s.z-s.d/2&&z-r<s.z+s.d/2);
  }
  function moveAxis(dx,dz){
    const nx=player.x+dx,nz=player.z+dz;
    if(!collides(nx,player.z))player.x=nx;
    if(!collides(player.x,nz))player.z=nz;
    player.x=Math.max(-22.5,Math.min(22.5,player.x));
    player.z=Math.max(-22.5,Math.min(22.5,player.z));
  }
  function finish(win){
    ended=true;document.exitPointerLock();
    show(win?'WYGRANA!':'KONIEC GRY',win?'Zebrałeś wszystkie kryształy!':'Strażnicy Cię złapali.','ZAGRAJ PONOWNIE');
  }

  function update(dt,t){
    if(!locked||ended)return;
    const speed=(keys.ShiftLeft||keys.ShiftRight)?8:5;
    let f=(keys.KeyW?1:0)-(keys.KeyS?1:0), side=(keys.KeyD?1:0)-(keys.KeyA?1:0);
    const len=Math.hypot(f,side)||1; f/=len;side/=len;
    const dx=(-Math.sin(player.yaw)*f+Math.cos(player.yaw)*side)*speed*dt;
    const dz=(-Math.cos(player.yaw)*f-Math.sin(player.yaw)*side)*speed*dt;
    moveAxis(dx,dz);
    if(keys.Space&&player.onGround){player.vy=7.2;player.onGround=false;}
    player.vy-=19*dt;player.y+=player.vy*dt;
    if(player.y<=0){player.y=0;player.vy=0;player.onGround=true;}
    
    camera.position.set(player.x,1.65+player.y,player.z);
    camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;

    if(isConnected && conn && conn.open) {
      conn.send({ x: player.x, z: player.z });
    }

    crystals.forEach((g,i)=>{if(!g.visible)return;g.rotation.y+=dt*1.4;g.position.y=.12+Math.sin(t*.003+i)*.12;
      if(Math.hypot(player.x-g.position.x,player.z-g.position.z)<1.35){g.visible=false;score++;scoreEl.textContent=score;if(score===8)finish(true);}
    });
    enemies.forEach((e,i)=>{
      e.mesh.position.x=e.origin.x+Math.sin(t*.00065+e.phase)*3.2;
      e.mesh.position.z=e.origin.z+Math.cos(t*.0005+e.phase)*3.2;
      e.mesh.rotation.y=Math.sin(t*.001+e.phase);
      if(invuln<=0&&Math.hypot(player.x-e.mesh.position.x,player.z-e.mesh.position.z)<1.15){
        lives--;livesEl.textContent=lives;invuln=1.5;
        player.x=-20;player.z=-20;player.y=0;player.vy=0;
        if(lives<=0)finish(false);
      }
    });
    invuln-=dt;
  }

  function animate(now){
    requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;
    update(dt,now);renderer.render(scene,camera);
  }
  requestAnimationFrame(animate);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
</body>
</html>
