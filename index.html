<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arena P2P Multiplayer</title>
    <!-- Ładowanie biblioteki PeerJS z CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #080811;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            border: 2px solid #00f3ff;
            border-radius: 8px;
            background: #0d0e1b;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #121526 0%, #080811 100%);
        }

        /* EKRANY MENU / LOBBY */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(8, 8, 17, 0.95);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.8rem;
            color: #00f3ff;
            text-shadow: 0 0 15px #00f3ff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 25px;
            border-radius: 12px;
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        input[type="text"] {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00f3ff;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        button {
            background: linear-gradient(45deg, #00f3ff, #ff0077);
            border: none;
            color: white;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(255, 0, 119, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .code-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff0077;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #ff0077;
            letter-spacing: 4px;
            cursor: pointer;
        }

        /* HUD W GRACH */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        .hud-box {
            background: rgba(8, 8, 17, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.4);
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .hp-bar-outer {
            width: 150px;
            height: 14px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0055;
            border-radius: 7px;
            overflow: hidden;
            margin-top: 4px;
        }

        .hp-bar-inner {
            height: 100%;
            width: 100%;
            background: #ff0055;
            transition: width 0.1s ease;
        }

        #status-msg {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- EKRAN GŁÓWNY MENU -->
    <div id="menu-screen" class="screen">
        <h1>NEON ARENA P2P</h1>
        <div class="card">
            <input type="text" id="player-name
