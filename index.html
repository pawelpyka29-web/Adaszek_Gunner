<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kryształowy Labirynt 3D - Firebase Multiplayer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud">
  💎 Kryształy: <span id="score">0</span>/8<br>
  ❤️ Życia: <span id="lives">3</span><br>
  🌐 Firebase: <span id="net-status" style="color:#ffeb3b">Łączenie...</span><br>
  👥 Gracze online: <span id="players-count">1</span>
</div>
<div id="help" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:2;background:#101827cc;padding:10px 16px;border-radius:10px;text-align:center;font-size:14px;white-space:nowrap;">WASD – ruch · Mysz – rozglądanie · Spacja – skok · Shift – sprint · ESC – pauza</div>

<div id="overlay">
  <div class="container" id="panel">
    <h1>Kryształowy Labirynt 3D</h1>
    <p style="color: #d5deeb; line-height: 1.5;">Zbierz wszystkie 8 kryształów i unikaj strażników.<br>Połączenie z serwerem odbywa się automatycznie!</p>
    <button id="start">GRAJ</button>
    <p id="message"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
